name: Deploy to evgeny.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pot-luck-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment credentials
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$SITE_DEPLOY_KEY" ]; then
            echo "::error::SITE_DEPLOY_KEY is missing from this repository's Actions secrets."
            exit 1
          fi

      - name: Checkout game repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check that this is still the latest main commit
        id: current
        run: |
          git fetch origin main
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit will publish its build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout site repo
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: evgenyio/evgenyio.github.io
          ref: master
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site

      - name: Deploy to /games/pot-luck/
        if: steps.current.outputs.publish == 'true'
        run: |
          mkdir -p site/games/pot-luck
          rsync -a --delete dist/ site/games/pot-luck/

      - name: Commit and push
        if: steps.current.outputs.publish == 'true'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/pot-luck
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy Pot Luck (${GITHUB_SHA:0:7})"
          # Other games publish here too. Rebase to retain their latest changes.
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Could not push the site update after three attempts."
          exit 1

      - name: Wait for the public site to serve this build
        if: steps.current.outputs.publish == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const expected = JSON.parse(readFileSync('dist/version.json', 'utf8')).id;
          const site = 'https://evgeny.io/games/pot-luck/';
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const res = await fetch(`${site}version.json?build=${encodeURIComponent(expected)}&attempt=${attempt}`, {
                cache: 'no-store', signal: AbortSignal.timeout(10000),
              });
              if (res.ok && (await res.json()).id === expected) {
                console.log(`Published ${expected} at ${site}`);
                appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Published [Pot Luck](${site}) from \`${process.env.GITHUB_SHA}\`.\n`);
                process.exit(0);
              }
            } catch (error) {
              console.log(`Waiting for GitHub Pages: ${error.message}`);
            }
            await setTimeout(5000);
          }
          throw new Error(`The public site did not serve build ${expected} within the deployment window.`);
          NODE
